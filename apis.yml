aid: virto-commerce
name: Virto Commerce
description: Virto Commerce is an open-source, API-first B2B e-commerce platform built
  on .NET Core. It provides REST and GraphQL APIs for catalog management, pricing,
  inventory, order management, customer organizations, marketing, payments, shipping,
  subscriptions, and complex B2B purchasing workflows including quotes, contracts,
  and approval routing. The modular architecture offers 100+ independently deployable
  modules covering the full commerce stack for enterprise deployments.
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: false
  try_now: true
  public: false
  label: Freemium · Self-serve signup
  confidence: high
