- aid: virto-commerce:virto-commerce-quotes-api
  name: Virto Commerce Quotes API
  description: Quoter enables business users to execute quote requests online. Once initiated, an online
    conversation takes place with internal users who interact with the business user's request. The internal
    user can set prices for quantity breaks or discounts. The quote is then made available to the business
    user online. The business user can accept the quote and place the order, continue the conversation,
    or reject the quote.
