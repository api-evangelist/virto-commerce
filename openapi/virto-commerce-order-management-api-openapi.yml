          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/CustomerOrder'
          text/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/CustomerOrder'
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2: []
      - api_key: []
      - api_key_header: []
      - http-signature: []
      - basic: []
      x-virtocommerce-module-id: VirtoCommerce.Orders
    delete:
      tags:
      - Order Management
      summary: Delete a whole customer orders
      operationId: OrderModule_DeleteOrdersByIds
      parameters:
      - name: ids
        in: query
        description: customer order ids for delete
        schema:
          type: array
          items:
            type: string
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2: []
      - api_key: []
      - api_key_header: []
      - http-signature: []
      - basic: []
      x-virtocommerce-module-id: VirtoCommerce.Orders
