      - api_key:
        - order:create
      - api_key_header:
        - order:create
      - http-signature:
        - order:create
      - basic:
        - order:create
      x-virtocommerce-module-id: VirtoCommerce.Orders
    put:
      tags:
      - Order Management
      summary: Update a existing customer order
      operationId: OrderModule_UpdateOrder
      requestBody:
