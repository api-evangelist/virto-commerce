openapi: 3.2.0
info:
  title: VirtoCommerce.Orders Order Management API
  version: v1
  description: Document based flexible order management system.
tags:
- name: Order Management
  description: Document based flexible order management system.
paths:
  /api/order/customerOrders/search:
    post:
      tags:
      - Order Management
      summary: Search customer orders by given criteria
      operationId: OrderModule_SearchCustomerOrder
      requestBody:
        description: criteria
        content:
          application/json-patch+json:
            schema:
              allOf:
              - $ref: '#/components/schemas/CustomerOrderSearchCriteria'
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/CustomerOrderSearchCriteria'
          text/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/CustomerOrderSearchCriteria'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/CustomerOrderSearchResult'
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerOrderSearchResult'
            text/json:
              schema:
                $ref: '#/components/schemas/CustomerOrderSearchResult'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2: []
      - api_key: []
      - api_key_header: []
      - http-signature: []
      - basic: []
      x-virtocommerce-module-id: VirtoCommerce.Orders
  /api/order/customerOrders/number/{number}:
    get:
      tags:
      - Order Management
      summary: Find customer order by number
      description: Return a single customer order with all nested documents or null if order was not found
      operationId: OrderModule_GetByNumber
      parameters:
      - name: number
        in: path
        description: customer order number
        required: true
        schema:
          type: string
      - name: respGroup
        in: query
        description: ''
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/CustomerOrder'
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerOrder'
            text/json:
              schema:
                $ref: '#/components/schemas/CustomerOrder'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2: []
      - api_key: []
      - api_key_header: []
      - http-signature: []
      - basic: []
      x-virtocommerce-module-id: VirtoCommerce.Orders
  /api/order/customerOrders/{id}:
    get:
      tags:
      - Order Management
      summary: Find customer order by id
      description: Return a single customer order with all nested documents or null if order was not found
      operationId: OrderModule_GetById
      parameters:
      - name: id
        in: path
        description: customer order id
        required: true
        schema:
          type: string
      - name: respGroup
        in: query
        description: ''
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/CustomerOrder'
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerOrder'
            text/json:
              schema:
                $ref: '#/components/schemas/CustomerOrder'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2: []
      - api_key: []
      - api_key_header: []
      - http-signature: []
      - basic: []
      x-virtocommerce-module-id: VirtoCommerce.Orders
    patch:
      tags:
      - Order Management
      summary: Partial update for the specified Orde by id
      operationId: OrderModule_PatcOrder
      parameters:
      - name: id
        in: path
        description: Orde id
        required: true
        schema:
          type: string
      requestBody:
        description: JsonPatchDocument object with fields to update
        content:
          application/json-patch+json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Operation'
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Operation'
          text/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Operation'
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2: []
      - api_key: []
      - api_key_header: []
      - http-signature: []
      - basic: []
      x-virtocommerce-module-id: VirtoCommerce.Orders
  /api/order/customerOrders/outer/{outerId}:
    get:
      tags:
      - Order Management
      summary: Find customer order by outer id
      description: Return a single customer order with all nested documents or null if order was not found
      operationId: OrderModule_GetByOuterId
      parameters:
      - name: outerId
        in: path
        description: customer order outer id
        required: true
        schema:
          type: string
      - name: responseGroup
        in: query
        description: ''
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/CustomerOrder'
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerOrder'
            text/json:
              schema:
                $ref: '#/components/schemas/CustomerOrder'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2: []
      - api_key: []
      - api_key_header: []
      - http-signature: []
      - basic: []
      x-virtocommerce-module-id: VirtoCommerce.Orders
  /api/order/customerOrders/recalculate:
    put:
      tags:
      - Order Management
      summary: Calculate order totals after changes
      description: Return order with recalculated totals
      operationId: OrderModule_CalculateTotals
      requestBody:
        description: Customer order
        content:
          application/json-patch+json:
            schema:
              allOf:
              - $ref: '#/components/schemas/CustomerOrder'
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/CustomerOrder'
          text/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/CustomerOrder'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/CustomerOrder'
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerOrder'
            text/json:
              schema:
                $ref: '#/components/schemas/CustomerOrder'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2: []
      - api_key: []
      - api_key_header: []
      - http-signature: []
      - basic: []
      x-virtocommerce-module-id: VirtoCommerce.Orders
  /api/order/customerOrders/{orderId}/processPayment/{paymentId}:
    post:
      tags:
      - Order Management
      summary: Register customer order payment in external payment system
      description: Used in storefront checkout or manual order payment registration
      operationId: OrderModule_ProcessOrderPayments
      parameters:
      - name: orderId
        in: path
        description: customer order id
        required: true
        schema:
          type: string
      - name: paymentId
        in: path
        description: payment id
        required: true
        schema:
          type: string
      requestBody:
        description: banking card information
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/BankCardInfo'
          application/json-patch+json:
            schema:
              allOf:
              - $ref: '#/components/schemas/BankCardInfo'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProcessPaymentRequestResult'
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessPaymentRequestResult'
            text/json:
              schema:
                $ref: '#/components/schemas/ProcessPaymentRequestResult'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2: []
      - api_key: []
      - api_key_header: []
      - http-signature: []
      - basic: []
      x-virtocommerce-module-id: VirtoCommerce.Orders
  /api/order/customerOrders/{cartId}:
    post:
