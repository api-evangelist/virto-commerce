openapi: 3.2.0
info:
  title: Virto Commerce Solution REST API Documentation…
  description: Virto Commerce provides API documentation in two formats, JSON and YAML, with schema files generated as swagger.json and swagger.yaml. To ensure secure access, authorization filters can be applied using a specific key to grant access. This allows authorized users to securely interact with the API and access the necessary resources while maintaining confidentiality and data integrity.
  termsOfService: https://virtocommerce.com/terms
  contact:
    name: Virto Commerce
    url: https://virtocommerce.com
    email: support@virtocommerce.com
  license:
    name: Virto Commerce Open Software License 3.0
    url: https://virtocommerce.com/open-source-license
  version: v1
tags:
- name: VirtoCommerce Platform
  description: B2B Innovation Platform
paths:
  /externalsignin:
    get:
      tags:
      - VirtoCommerce Platform
      operationId: ExternalSignIn_SignIn
      parameters:
      - name: AuthenticationType
        in: query
        schema:
          type: string
      - name: ReturnUrl
        in: query
        schema:
          type: string
      - name: StoreId
        in: query
        schema:
          type: string
      - name: OidcUrl
        in: query
        schema:
          type: string
      - name: CallbackUrl
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
      x-virtocommerce-module-id: VirtoCommerce.Platform
      summary: External sign in sign in
      x-summary-source: derived
  /externalsignin/signout:
    get:
      tags:
      - VirtoCommerce Platform
      operationId: ExternalSignIn_SignOut
      parameters:
      - name: authenticationType
        in: query
        schema:
          type: string
      - name: returnUrl
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
      x-virtocommerce-module-id: VirtoCommerce.Platform
      summary: External sign in sign out
      x-summary-source: derived
  /externalsignin/callback:
    get:
      tags:
      - VirtoCommerce Platform
      operationId: ExternalSignIn_SignInCallback
      parameters:
      - name: returnUrl
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
      x-virtocommerce-module-id: VirtoCommerce.Platform
      summary: External sign in sign in callback
      x-summary-source: derived
  /externalsignin/providers:
    get:
      tags:
      - VirtoCommerce Platform
      operationId: ExternalSignIn_GetExternalLoginProviders
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExternalSignInProviderInfo'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExternalSignInProviderInfo'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExternalSignInProviderInfo'
      x-virtocommerce-module-id: VirtoCommerce.Platform
      summary: External sign in get external login providers
      x-summary-source: derived
  /api/apps/{appId}/manifest:
    get:
      tags:
      - VirtoCommerce Platform
      summary: Returns the host app's plugin manifest.
      operationId: AppManifest_GetManifest
      parameters:
      - name: appId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
