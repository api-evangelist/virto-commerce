components:
  schemas:
    PushNotificationSearchCriteria:
      type: object
      properties:
        ids:
          type:
          - array
          - 'null'
          items:
            type: string
        onlyNew:
          type: boolean
        startDate:
          type:
          - string
          - 'null'
          format: date-time
        endDate:
          type:
          - string
          - 'null'
          format: date-time
        responseGroup:
          type:
          - string
          - 'null'
        objectType:
          type:
          - string
          - 'null'
        objectTypes:
          type:
          - array
          - 'null'
          items:
            type: string
        objectIds:
          type:
          - array
          - 'null'
          items:
            type: string
        keyword:
          type:
          - string
          - 'null'
        searchPhrase:
          type:
          - string
          - 'null'
        languageCode:
          type:
          - string
          - 'null'
        sort:
          type:
          - string
          - 'null'
        sortInfos:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SortInfo'
          readOnly: true
        skip:
          type: integer
          format: int32
        take:
          type: integer
          format: int32
      additionalProperties: false
    ModuleDescriptor:
      type: object
      properties:
        version:
          type:
          - string
          - 'null'
        platformVersion:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        authors:
          type:
          - array
          - 'null'
          items:
            type: string
        owners:
          type:
          - array
          - 'null'
          items:
            type: string
        licenseUrl:
          type:
          - string
          - 'null'
        projectUrl:
          type:
          - string
          - 'null'
        iconUrl:
          type:
          - string
          - 'null'
        requireLicenseAcceptance:
          type: boolean
        releaseNotes:
          type:
          - string
          - 'null'
        copyright:
          type:
          - string
          - 'null'
        tags:
          type:
          - string
          - 'null'
        groups:
          type:
          - array
          - 'null'
          items:
            type: string
        dependencies:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ModuleIdentity'
        validationErrors:
          type:
          - array
          - 'null'
          items:
            type: string
        isRemovable:
          type: boolean
        isInstalled:
          type: boolean
        installedVersion:
          allOf:
          - $ref: '#/components/schemas/ModuleIdentity'
        packageUrl:
          type:
          - string
          - 'null'
        id:
          type:
          - string
          - 'null'
      additionalProperties: false
    PluginEntry:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
          description: 'Unique plugin id within the (host app, request) tuple.

            Defaults to the owning .NET module id (e.g. `VirtoCommerce.MarketplaceReviews`).'
        version:
          type:
          - string
          - 'null'
          description: Plugin version. Defaults to the parent module version.
        entry:
          allOf:
          - $ref: '#/components/schemas/ContentFile'
          description: 'The plugin''s primary file. For Module Federation plugins this is the

            federation entry (`remoteEntry.js`). For the legacy AngularJS host

            it is the module bundle (`dist/app.js`). Always a script.'
