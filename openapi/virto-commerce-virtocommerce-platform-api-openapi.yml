                  $ref: '#/components/schemas/AppDescriptor'
      x-virtocommerce-module-id: VirtoCommerce.Platform
  /revoke/token:
    post:
      tags:
      - VirtoCommerce Platform
      operationId: Authorization_RevokeCurrentUserToken
      responses:
        '200':
          description: OK
      x-virtocommerce-module-id: VirtoCommerce.Platform
      summary: Authorization revoke current user token
      x-summary-source: derived
  /connect/token:
    post:
      tags:
      - VirtoCommerce Platform
      operationId: Authorization_Exchange
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              required:
              - grant_type
              type: object
              properties:
                grant_type:
                  type: string
                scope:
                  type: string
                username:
                  type: string
                password:
                  type: string
                storeId:
                  type: string
                user_id:
                  type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenIddictResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenIddictResponse'
      x-virtocommerce-module-id: VirtoCommerce.Platform
      summary: Authorization exchange
      x-summary-source: derived
  /connect/authorize:
    get:
      tags:
      - VirtoCommerce Platform
      operationId: Authorization_Authorize
      responses:
        '200':
          description: OK
      x-virtocommerce-module-id: VirtoCommerce.Platform
      summary: Authorization authorize
      x-summary-source: derived
    post:
      tags:
      - VirtoCommerce Platform
      operationId: Authorization_Authorize
      responses:
        '200':
          description: OK
      x-virtocommerce-module-id: VirtoCommerce.Platform
      summary: Authorization authorize
      x-summary-source: derived
  /connect/userinfo:
