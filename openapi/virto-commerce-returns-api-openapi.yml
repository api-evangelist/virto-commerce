openapi: 3.2.0
info:
  title: VirtoCommerce.Return Returns API
  version: v1
  description: Return management module
tags:
- name: Returns
  description: Return management module
paths:
  /api/return/search:
    post:
      tags:
      - Returns
      operationId: Return_SearchReturns
      requestBody:
        content:
          application/json-patch+json:
            schema:
              allOf:
              - $ref: '#/components/schemas/ReturnSearchCriteria'
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/ReturnSearchCriteria'
          text/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/ReturnSearchCriteria'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Return'
            application/json:
              schema:
                $ref: '#/components/schemas/Return'
            text/json:
              schema:
                $ref: '#/components/schemas/Return'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - return:read
      - api_key:
        - return:read
      - api_key_header:
        - return:read
      - http-signature:
        - return:read
      - basic:
        - return:read
      x-virtocommerce-module-id: VirtoCommerce.Return
      summary: Return search returns
      x-summary-source: derived
  /api/return/{id}:
    get:
      tags:
      - Returns
      operationId: Return_GetReturnById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Return'
            application/json:
              schema:
                $ref: '#/components/schemas/Return'
            text/json:
              schema:
                $ref: '#/components/schemas/Return'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - return:read
      - api_key:
        - return:read
      - api_key_header:
        - return:read
      - http-signature:
        - return:read
      - basic:
        - return:read
      x-virtocommerce-module-id: VirtoCommerce.Return
      summary: Return get return by id
      x-summary-source: derived
  /api/return:
    put:
      tags:
      - Returns
      operationId: Return_UpdateReturn
      requestBody:
        content:
          application/json-patch+json:
            schema:
              allOf:
              - $ref: '#/components/schemas/Return'
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/Return'
          text/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/Return'
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - return:update
      - api_key:
        - return:update
      - api_key_header:
        - return:update
      - http-signature:
        - return:update
      - basic:
        - return:update
      x-virtocommerce-module-id: VirtoCommerce.Return
      summary: Return update return
      x-summary-source: derived
    delete:
      tags:
      - Returns
      operationId: Return_DeleteReturn
      parameters:
      - name: ids
        in: query
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - return:delete
      - api_key:
        - return:delete
      - api_key_header:
        - return:delete
      - http-signature:
        - return:delete
      - basic:
        - return:delete
      x-virtocommerce-module-id: VirtoCommerce.Return
      summary: Return delete return
      x-summary-source: derived
  /api/return/available-quantities/{orderId}:
    get:
      tags:
      - Returns
      operationId: Return_GetAvailableQuantities
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: object
                additionalProperties:
                  type: integer
                  format: int32
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
                  format: int32
            text/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
                  format: int32
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - return:read
      - api_key:
        - return:read
      - api_key_header:
        - return:read
      - http-signature:
        - return:read
      - basic:
        - return:read
      x-virtocommerce-module-id: VirtoCommerce.Return
      summary: Return get available quantities
      x-summary-source: derived
