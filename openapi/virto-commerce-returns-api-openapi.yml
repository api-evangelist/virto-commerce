openapi: 3.0.4
info:
  title: Virto Commerce Returns API
  version: v1
  description: 'Return management: search returns, fetch a return by id, create or update a return, and
    read the quantities still available to return against an order.'
paths:
  /api/return/search:
    post:
      tags:
      - Returns
      operationId: Return_SearchReturns
      requestBody:
        content:
          application/json-patch+json:
            schema:
              allOf:
              - $ref: '#/components/schemas/ReturnSearchCriteria'
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/ReturnSearchCriteria'
          text/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/ReturnSearchCriteria'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Return'
            application/json:
              schema:
                $ref: '#/components/schemas/Return'
            text/json:
              schema:
                $ref: '#/components/schemas/Return'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - return:read
      - api_key:
        - return:read
      - api_key_header:
        - return:read
      - http-signature:
        - return:read
      - basic:
        - return:read
      x-virtocommerce-module-id: VirtoCommerce.Return
  /api/return/{id}:
    get:
      tags:
      - Returns
      operationId: Return_GetReturnById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Return'
            application/json:
              schema:
                $ref: '#/components/schemas/Return'
            text/json:
              schema:
                $ref: '#/components/schemas/Return'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - return:read
      - api_key:
        - return:read
      - api_key_header:
        - return:read
      - http-signature:
        - return:read
      - basic:
        - return:read
      x-virtocommerce-module-id: VirtoCommerce.Return
  /api/return:
    put:
      tags:
      - Returns
      operationId: Return_UpdateReturn
      requestBody:
        content:
          application/json-patch+json:
            schema:
              allOf:
              - $ref: '#/components/schemas/Return'
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/Return'
          text/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/Return'
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - return:update
      - api_key:
        - return:update
      - api_key_header:
        - return:update
      - http-signature:
        - return:update
      - basic:
        - return:update
      x-virtocommerce-module-id: VirtoCommerce.Return
    delete:
      tags:
      - Returns
      operationId: Return_DeleteReturn
      parameters:
      - name: ids
        in: query
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - return:delete
      - api_key:
        - return:delete
      - api_key_header:
        - return:delete
      - http-signature:
        - return:delete
      - basic:
        - return:delete
      x-virtocommerce-module-id: VirtoCommerce.Return
  /api/return/available-quantities/{orderId}:
    get:
      tags:
      - Returns
      operationId: Return_GetAvailableQuantities
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: object
                additionalProperties:
                  type: integer
                  format: int32
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
                  format: int32
            text/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
                  format: int32
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - return:read
      - api_key:
        - return:read
      - api_key_header:
        - return:read
      - http-signature:
        - return:read
      - basic:
        - return:read
      x-virtocommerce-module-id: VirtoCommerce.Return
components:
  schemas:
    AddressType:
      enum:
      - Undefined
      - Billing
      - Shipping
      - BillingAndShipping
      - Pickup
      type: string
    CancelledState:
      enum:
      - Undefined
      - Requested
      - Completed
