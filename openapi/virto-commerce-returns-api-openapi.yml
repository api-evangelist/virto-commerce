          nullable: true
        amount:
          type: number
          format: double
        vendorId:
          type: string
          nullable: true
        transactionId:
          type: string
          nullable: true
        customerOrderId:
          type: string
          nullable: true
        paymentId:
          type: string
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/CaptureItem'
          nullable: true
        closeTransaction:
          type: boolean
        operationType:
          type: string
          nullable: true
        parentOperationId:
          type: string
          nullable: true
        number:
          type: string
          nullable: true
        isApproved:
          type: boolean
        status:
          type: string
          nullable: true
        comment:
          type: string
          nullable: true
        currency:
          type: string
          nullable: true
        sum:
          type: number
          format: double
        outerId:
          type: string
          nullable: true
        cancelledState:
          allOf:
          - $ref: '#/components/schemas/CancelledState'
          description: For system use to handle canellation flow
        isCancelled:
          type: boolean
          description: Used by payment provides to indicate that cancellation operation has completed
        cancelledDate:
          type: string
          format: date-time
          nullable: true
        cancelReason:
          type: string
          nullable: true
        dynamicProperties:
          type: array
          items:
            $ref: '#/components/schemas/DynamicObjectProperty'
          nullable: true
        operationsLog:
          type: array
          items:
            $ref: '#/components/schemas/OperationLog'
          nullable: true
        createdDate:
          type: string
          format: date-time
        modifiedDate:
          type: string
          format: date-time
          nullable: true
        createdBy:
          maxLength: 64
          minLength: 0
          type: string
          nullable: true
        modifiedBy:
          maxLength: 64
          minLength: 0
          type: string
          nullable: true
        id:
          type: string
          nullable: true
      additionalProperties: false
    CaptureItem:
      type: object
      properties:
        quantity:
          type: integer
          format: int32
        lineItemId:
          type: string
          nullable: true
        lineItem:
          allOf:
          - $ref: '#/components/schemas/OrderLineItem'
          nullable: true
        captureId:
          type: string
          nullable: true
        outerId:
          type: string
          nullable: true
        createdDate:
          type: string
          format: date-time
        modifiedDate:
          type: string
          format: date-time
          nullable: true
        createdBy:
          maxLength: 64
          minLength: 0
          type: string
          nullable: true
        modifiedBy:
          maxLength: 64
          minLength: 0
          type: string
          nullable: true
        id:
          type: string
          nullable: true
      additionalProperties: false
    CustomerOrder:
      type: object
      properties:
        rowVersion:
          type: string
          format: byte
          nullable: true
        customerId:
          type: string
          nullable: true
        customerName:
          type: string
          nullable: true
        channelId:
          type: string
          nullable: true
        storeId:
          type: string
          nullable: true
        storeName:
          type: string
          nullable: true
        organizationId:
          type: string
          nullable: true
        organizationName:
          type: string
          nullable: true
        employeeId:
          type: string
          nullable: true
        employeeName:
          type: string
          nullable: true
        shoppingCartId:
          type: string
          description: The base shopping cart ID the order was created with
          nullable: true
        isPrototype:
          type: boolean
          description: This checkbox determines whether the order is a prototype
        purchaseOrderNumber:
          type: string
          description: The order internal number provided by customer
          nullable: true
        subscriptionNumber:
          type: string
          description: Number of subscription associated with this order
          nullable: true
        subscriptionId:
          type: string
          description: The ID of subscription associated with this order
          nullable: true
        objectType:
          type: string
          nullable: true
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/OrderAddress'
          nullable: true
        inPayments:
          type: array
          items:
            $ref: '#/components/schemas/PaymentIn'
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderLineItem'
          nullable: true
        shipments:
          type: array
          items:
            $ref: '#/components/schemas/OrderShipment'
          nullable: true
        feeDetails:
          type: array
          items:
            $ref: '#/components/schemas/FeeDetail'
          nullable: true
        relevanceScore:
          type: number
          format: double
          nullable: true
        discounts:
          type: array
          items:
            $ref: '#/components/schemas/Discount'
          nullable: true
