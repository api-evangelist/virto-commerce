openapi: 3.2.0
info:
  title: VirtoCommerce. Store API
  version: v1
  description: Multi store management with individual store settings
tags:
- name: Store
  description: Multi store management with individual store settings
paths:
  /api/store-authentication-schemes/{storeId}:
    get:
      tags:
      - Store
      operationId: StoreAuthenticationScheme_Get
      parameters:
      - name: storeId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StoreAuthenticationScheme'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StoreAuthenticationScheme'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StoreAuthenticationScheme'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - store:read
      - api_key:
        - store:read
      - api_key_header:
        - store:read
      - http-signature:
        - store:read
      - basic:
        - store:read
      x-virtocommerce-module-id: VirtoCommerce.Store
      summary: Store authentication scheme get
      x-summary-source: derived
    put:
      tags:
      - Store
      operationId: StoreAuthenticationScheme_Update
      parameters:
      - name: storeId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json-patch+json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/StoreAuthenticationScheme'
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/StoreAuthenticationScheme'
          text/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/StoreAuthenticationScheme'
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - store:update
      - api_key:
        - store:update
      - api_key_header:
        - store:update
      - http-signature:
        - store:update
      - basic:
        - store:update
      x-virtocommerce-module-id: VirtoCommerce.Store
      summary: Store authentication scheme update
      x-summary-source: derived
  /api/stores/search:
    post:
      tags:
      - Store
      summary: Search stores
      operationId: StoreModule_SearchStores
      requestBody:
        content:
          application/json-patch+json:
            schema:
              allOf:
              - $ref: '#/components/schemas/StoreSearchCriteria'
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/StoreSearchCriteria'
          text/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/StoreSearchCriteria'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/StoreSearchResult'
            application/json:
              schema:
                $ref: '#/components/schemas/StoreSearchResult'
            text/json:
              schema:
                $ref: '#/components/schemas/StoreSearchResult'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2: []
      - api_key: []
      - api_key_header: []
      - http-signature: []
      - basic: []
      x-virtocommerce-module-id: VirtoCommerce.Store
  /api/stores/{id}:
    get:
      tags:
      - Store
      summary: Get store by id
      operationId: StoreModule_GetStoreById
      parameters:
      - name: id
        in: path
        description: Store id
        required: true
        schema:
          type: string
      - name: responseGroup
        in: query
        description: Response group
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Store'
            application/json:
              schema:
                $ref: '#/components/schemas/Store'
            text/json:
              schema:
                $ref: '#/components/schemas/Store'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2: []
      - api_key: []
      - api_key_header: []
      - http-signature: []
      - basic: []
      x-virtocommerce-module-id: VirtoCommerce.Store
    patch:
      tags:
      - Store
      summary: Partial update for the specified store by id
      operationId: StoreModule_PatchStore
      parameters:
      - name: id
        in: path
        description: Store id
        required: true
        schema:
          type: string
      requestBody:
        description: JsonPatchDocument object with fields to update
        content:
          application/json-patch+json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Operation'
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Operation'
          text/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Operation'
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2: []
      - api_key: []
      - api_key_header: []
      - http-signature: []
      - basic: []
      x-virtocommerce-module-id: VirtoCommerce.Store
  /api/stores/outer/{outerId}:
    get:
      tags:
      - Store
      summary: Gets store by outer id
      description: Gets store by outer id (integration key) with full information loaded
      operationId: StoreModule_GetStoreByOuterId
      parameters:
      - name: outerId
        in: path
        description: Store outer id
        required: true
        schema:
          type: string
      - name: responseGroup
        in: query
        description: Response group
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Store'
            application/json:
              schema:
                $ref: '#/components/schemas/Store'
            text/json:
              schema:
                $ref: '#/components/schemas/Store'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2: []
      - api_key: []
      - api_key_header: []
      - http-signature: []
      - basic: []
      x-virtocommerce-module-id: VirtoCommerce.Store
  /api/stores:
    post:
      tags:
      - Store
      summary: Create store
      operationId: StoreModule_CreateStore
      requestBody:
        description: Store
        content:
          application/json-patch+json:
            schema:
              allOf:
              - $ref: '#/components/schemas/Store'
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/Store'
          text/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/Store'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Store'
            application/json:
              schema:
                $ref: '#/components/schemas/Store'
            text/json:
              schema:
                $ref: '#/components/schemas/Store'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - store:create
      - api_key:
        - store:create
      - api_key_header:
        - store:create
      - http-signature:
        - store:create
      - basic:
        - store:create
      x-virtocommerce-module-id: VirtoCommerce.Store
    put:
      tags:
      - Store
      summary: Update store
      operationId: StoreModule_UpdateStore
      requestBody:
        description: Store
        content:
          application/json-patch+json:
            schema:
              allOf:
              - $ref: '#/components/schemas/Store'
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/Store'
          text/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/Store'
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2: []
      - api_key: []
      - api_key_header: []
      - http-signature: []
      - basic: []
      x-virtocommerce-module-id: VirtoCommerce.Store
    delete:
      tags:
      - Store
      summary: Delete stores
      operationId: StoreModule_DeleteStore
      parameters:
      - name: ids
        in: query
        description: Ids of store that needed to delete
        schema:
          type: array
          items:
            type: string
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2: []
      - api_key: []
      - api_key_header: []
      - http-signature: []
      - basic: []
      x-virtocommerce-module-id: VirtoCommerce.Store
  /api/stores/send/dynamicnotification:
    post:
      tags:
      - Store
      summary: Send dynamic notification (contains custom list of properties) to store or…
      operationId: StoreModule_SendDynamicNotificationToStoreEmail
      requestBody:
        description: ''
        content:
          application/json-patch+json:
            schema:
              allOf:
              - $ref: '#/components/schemas/SendDynamicNotificationRequest'
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/SendDynamicNotificationRequest'
          text/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/SendDynamicNotificationRequest'
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2: []
      - api_key: []
      - api_key_header: []
      - http-signature: []
      - basic: []
      x-virtocommerce-module-id: VirtoCommerce.Store
  /api/stores/{storeId}/accounts/{id}/loginonbehalf:
    get:
      tags:
      - Store
      summary: Check if given contact has login on behalf permission
      operationId: StoreModule_GetLoginOnBehalfInfo
      parameters:
      - name: storeId
        in: path
        description: Store ID
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: Contact ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/LoginOnBehalfInfo'
            application/json:
              schema:
                $ref: '#/components/schemas/LoginOnBehalfInfo'
            text/json:
              schema:
                $ref: '#/components/schemas/LoginOnBehalfInfo'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2: []
      - api_key: []
      - api_key_header: []
      - http-signature: []
      - basic: []
      x-virtocommerce-module-id: VirtoCommerce.Store
  /api/stores/allowed/{userId}:
    get:
      tags:
      - Store
      summary: Returns list of stores which user can sign in
      operationId: StoreModule_GetUserAllowedStores
      parameters:
      - name: userId
        in: path
        description: ''
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Store'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Store'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Store'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2: []
      - api_key: []
      - api_key_header: []
      - http-signature: []
      - basic: []
      x-virtocommerce-module-id: VirtoCommerce.Store
  /api/stores/{id}/public-settings:
    get:
      tags:
      - Store
      operationId: StoreModule_GetStorePublicSettingsById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModulePublicStoreSettings'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModulePublicStoreSettings'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModulePublicStoreSettings'
      x-virtocommerce-module-id: VirtoCommerce.Store
      summary: Store module get store public settings by id
      x-summary-source: derived
components:
  schemas:
    LoginOnBehalfInfo:
      type: object
      properties:
        userName:
          type:
          - string
          - 'null'
        canLoginOnBehalf:
          type: boolean
      additionalProperties: false
      description: Represent result for checking of possibility login on behalf request
    StoreSearchResult:
      type: object
      properties:
        totalCount:
          type: integer
          format: int32
        results:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Store'
      additionalProperties: false
    StoreAuthenticationScheme:
      type: object
      properties:
        storeId:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
        displayName:
          type:
          - string
          - 'null'
        isActive:
          type: boolean
        position:
          type: integer
          format: int32
        createdDate:
          type: string
          format: date-time
        modifiedDate:
          type:
          - string
          - 'null'
          format: date-time
        createdBy:
          maxLength: 64
          minLength: 0
          type:
          - string
          - 'null'
        modifiedBy:
          maxLength: 64
          minLength: 0
          type:
          - string
          - 'null'
        id:
          type:
          - string
          - 'null'
      additionalProperties: false
    SendDynamicNotificationRequest:
      type: object
      properties:
        storeId:
          type:
          - string
          - 'null'
        type:
          type:
          - string
          - 'null'
        fields:
          type:
          - object
          - 'null'
          additionalProperties:
            type:
            - string
            - 'null'
        language:
          type:
          - string
          - 'null'
      additionalProperties: false
    DynamicPropertyValueType:
      enum:
      - Undefined
      - ShortText
      - LongText
      - Integer
      - Decimal
      - DateTime
      - Boolean
      - Html
      - Image
      type: string
    SeoInfo:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
        semanticUrl:
          type:
          - string
          - 'null'
        outline:
          type:
          - string
          - 'null'
        pageTitle:
          type:
          - string
          - 'null'
        metaDescription:
          type:
          - string
          - 'null'
        imageAltDescription:
          type:
          - string
          - 'null'
        metaKeywords:
          type:
          - string
          - 'null'
        storeId:
          type:
          - string
          - 'null'
        organizationId:
          type:
          - string
          - 'null'
        objectId:
          type:
          - string
          - 'null'
        objectType:
          type:
          - string
          - 'null'
        isActive:
          type: boolean
        languageCode:
          type:
          - string
          - 'null'
        createdDate:
          type: string
          format: date-time
        modifiedDate:
          type:
          - string
          - 'null'
          format: date-time
        createdBy:
          maxLength: 64
          minLength: 0
          type:
          - string
          - 'null'
        modifiedBy:
          maxLength: 64
          minLength: 0
          type:
          - string
          - 'null'
        id:
          type:
          - string
          - 'null'
      additionalProperties: false
    ObjectSettingEntry:
      type: object
      properties:
        itHasValues:
          type: boolean
          readOnly: true
        objectId:
          type:
          - string
          - 'null'
        objectType:
          type:
          - string
          - 'null'
        isReadOnly:
          type: boolean
        value:
          type:
          - object
          - 'null'
        id:
          type:
          - string
          - 'null'
        restartRequired:
          type: boolean
        moduleId:
          type:
          - string
          - 'null'
        groupName:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
        displayName:
          type:
          - string
          - 'null'
        isRequired:
          type: boolean
        isHidden:
          type: boolean
        isPublic:
          type: boolean
        valueType:
          allOf:
          - $ref: '#/components/schemas/SettingValueType'
        allowedValues:
          type:
          - array
          - 'null'
          items:
            type: object
        defaultValue:
          type:
          - object
          - 'null'
        isDictionary:
          type: boolean
        isLocalizable:
          type: boolean
        tenant:
          type:
          - string
          - 'null'
      additionalProperties: false
    SettingValueType:
      enum:
      - ShortText
      - LongText
      - Integer
      - Decimal
      - DateTime
      - Boolean
      - SecureString
      - Json
      - PositiveInteger
      type: string
    ModulePublicStoreSettings:
      type: object
      properties:
        moduleId:
          type:
          - string
          - 'null'
        settings:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/PublicStoreSetting'
      additionalProperties: false
    StoreState:
      enum:
      - Open
      - Closed
      - RestrictedAccess
      type: string
    StoreSearchCriteria:
      type: object
      properties:
        storeStates:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/StoreState'
        fulfillmentCenterIds:
          type:
          - array
          - 'null'
          items:
            type: string
        domain:
          type:
          - string
          - 'null'
        responseGroup:
          type:
          - string
          - 'null'
        objectType:
          type:
          - string
          - 'null'
        objectTypes:
          type:
          - array
          - 'null'
          items:
            type: string
        objectIds:
          type:
          - array
          - 'null'
          items:
            type: string
        keyword:
          type:
          - string
          - 'null'
        searchPhrase:
          type:
          - string
          - 'null'
        languageCode:
          type:
          - string
          - 'null'
        sort:
          type:
          - string
          - 'null'
        sortInfos:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SortInfo'
          readOnly: true
        skip:
          type: integer
          format: int32
        take:
          type: integer
          format: int32
      additionalProperties: false
    DynamicObjectProperty:
      type: object
      properties:
        objectId:
          type:
          - string
          - 'null'
        values:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/DynamicPropertyObjectValue'
        name:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        objectType:
          type:
          - string
          - 'null'
        isArray:
          type: boolean
        isDictionary:
          type: boolean
        isMultilingual:
          type: boolean
        isRequired:
          type: boolean
        displayOrder:
          type:
          - integer
          - 'null'
          format: int32
        valueType:
          allOf:
          - $ref: '#/components/schemas/DynamicPropertyValueType'
        displayNames:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/DynamicPropertyName'
        createdDate:
          type: string
          format: date-time
        modifiedDate:
          type:
          - string
          - 'null'
          format: date-time
        createdBy:
          maxLength: 64
          minLength: 0
          type:
          - string
          - 'null'
        modifiedBy:
          maxLength: 64
          minLength: 0
          type:
          - string
          - 'null'
        id:
          type:
          - string
          - 'null'
      additionalProperties: false
    Operation:
      type: object
      properties:
        value:
          type:
          - object
          - 'null'
        path:
          type:
          - string
          - 'null'
        op:
          type:
          - string
          - 'null'
        from:
          type:
          - string
          - 'null'
      additionalProperties: false
    PublicStoreSetting:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
        value:
          type:
          - object
          - 'null'
      additionalProperties: false
    DynamicPropertyName:
      type: object
      properties:
        locale:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
      additionalProperties: false
    Store:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        storeState:
          allOf:
          - $ref: '#/components/schemas/StoreState'
          description: Store current state (Open, Closed, RestrictedAccess)
        timeZone:
          type:
          - string
          - 'null'
        country:
          type:
          - string
          - 'null'
        region:
          type:
          - string
          - 'null'
        defaultLanguage:
          type:
          - string
          - 'null'
        defaultCurrency:
          type:
          - string
          - 'null'
        catalog:
          type:
          - string
          - 'null'
          description: Catalog id used as primary store catalog
        creditCardSavePolicy:
          type: boolean
        url:
          type:
          - string
          - 'null'
          description: Store storefront url
        secureUrl:
          type:
          - string
          - 'null'
          description: Store storefront https url
        email:
          type:
          - string
          - 'null'
          description: Primary store contact email can be used for store event notifications and for feed back
        adminEmail:
          type:
          - string
          - 'null'
        emailName:
          type:
          - string
          - 'null'
        adminEmailName:
          type:
          - string
          - 'null'
        displayOutOfStock:
          type: boolean
        outerId:
          type:
          - string
          - 'null'
        mainFulfillmentCenterId:
          type:
          - string
          - 'null'
          description: Primary (default) fulfillment center id
        additionalFulfillmentCenterIds:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Alternate fulfillment centers ids
        mainReturnsFulfillmentCenterId:
          type:
          - string
          - 'null'
          description: Primary (default) fulfillment center for order return
        returnsFulfillmentCenterIds:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Alternate fulfillment centers for order return
        languages:
          type:
          - array
          - 'null'
          items:
            type: string
          description: All store supported languages
        currencies:
          type:
          - array
          - 'null'
          items:
            type: string
          description: All store supported currencies
        trustedGroups:
          type:
          - array
          - 'null'
          items:
            type: string
          description: All store trusted groups (group of stores that shared the user logins)
        seoObjectType:
          type:
          - string
          - 'null'
          readOnly: true
        seoInfos:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SeoInfo'
        objectType:
          type:
          - string
          - 'null'
          readOnly: true
        dynamicProperties:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/DynamicObjectProperty'
        settings:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ObjectSettingEntry'
        typeName:
          type:
          - string
          - 'null'
          readOnly: true
        scopes:
          type:
          - array
