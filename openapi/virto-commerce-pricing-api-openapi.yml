      - name: ResponseGroup
        in: query
        schema:
          type: string
      - name: ObjectType
        in: query
        schema:
          type: string
      - name: ObjectTypes
        in: query
        schema:
          type: array
          items:
            type: string
      - name: ObjectIds
        in: query
        schema:
          type: array
          items:
            type: string
      - name: Keyword
        in: query
        schema:
          type: string
      - name: SearchPhrase
        in: query
        schema:
          type: string
      - name: LanguageCode
        in: query
        schema:
          type: string
      - name: Sort
        in: query
        schema:
          type: string
      - name: SortInfos
        in: query
        schema:
          type: array
          items:
            $ref: '#/components/schemas/SortInfo'
      - name: Skip
        in: query
        schema:
          type: integer
          format: int32
      - name: Take
        in: query
        schema:
          type: integer
          format: int32
      responses:
