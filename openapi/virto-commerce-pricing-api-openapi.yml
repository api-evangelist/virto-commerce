      summary: Get pricelist assignment by outer id
      operationId: PricingModule_GetPricelistAssignmentByOuterId
      parameters:
      - name: outerId
        in: path
        description: Pricelist assignment outer id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PricelistAssignment'
            application/json:
              schema:
                $ref: '#/components/schemas/PricelistAssignment'
            text/json:
              schema:
                $ref: '#/components/schemas/PricelistAssignment'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - pricing:read
      - api_key:
        - pricing:read
      - api_key_header:
        - pricing:read
      - http-signature:
        - pricing:read
      - basic:
        - pricing:read
      x-virtocommerce-module-id: VirtoCommerce.Pricing
  /api/pricing/assignments/new:
    get:
      tags:
      - Pricing
      summary: Get a new pricelist assignment
      description: Get a new pricelist assignment object. Create new pricelist assignment, but does not save one.
      operationId: PricingModule_GetNewPricelistAssignments
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PricelistAssignment'
            application/json:
              schema:
                $ref: '#/components/schemas/PricelistAssignment'
            text/json:
              schema:
                $ref: '#/components/schemas/PricelistAssignment'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - pricing:read
      - api_key:
        - pricing:read
      - api_key_header:
        - pricing:read
      - http-signature:
        - pricing:read
      - basic:
        - pricing:read
      x-virtocommerce-module-id: VirtoCommerce.Pricing
  /api/pricing/pricelists:
