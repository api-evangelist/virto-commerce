            application/json:
              schema:
                $ref: '#/components/schemas/PricelistSearchResult'
            text/json:
              schema:
                $ref: '#/components/schemas/PricelistSearchResult'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - pricing:read
      - api_key:
        - pricing:read
      - api_key_header:
        - pricing:read
      - http-signature:
        - pricing:read
      - basic:
        - pricing:read
      x-virtocommerce-module-id: VirtoCommerce.Pricing
    post:
      tags:
      - Pricing
      summary: Create pricelist
      operationId: PricingModule_CreatePriceList
      requestBody:
        content:
          application/json-patch+json:
            schema:
              allOf:
              - $ref: '#/components/schemas/Pricelist'
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/Pricelist'
          text/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/Pricelist'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Pricelist'
            application/json:
              schema:
                $ref: '#/components/schemas/Pricelist'
            text/json:
              schema:
                $ref: '#/components/schemas/Pricelist'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - pricing:read
        - pricing:create
      - api_key:
        - pricing:read
        - pricing:create
      - api_key_header:
        - pricing:read
        - pricing:create
      - http-signature:
        - pricing:read
        - pricing:create
      - basic:
        - pricing:read
        - pricing:create
      x-virtocommerce-module-id: VirtoCommerce.Pricing
    put:
      tags:
      - Pricing
      summary: Update pricelist
      operationId: PricingModule_UpdatePriceList
      requestBody:
        content:
          application/json-patch+json:
            schema:
              allOf:
              - $ref: '#/components/schemas/Pricelist'
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/Pricelist'
          text/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/Pricelist'
      responses:
        '204':
