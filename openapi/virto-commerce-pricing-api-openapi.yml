          description: No Content
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - pricing:read
        - pricing:delete
      - api_key:
        - pricing:read
        - pricing:delete
      - api_key_header:
        - pricing:read
        - pricing:delete
      - http-signature:
        - pricing:read
        - pricing:delete
      - basic:
        - pricing:read
        - pricing:delete
      x-virtocommerce-module-id: VirtoCommerce.Pricing
