openapi: 3.2.0
info:
  title: VirtoCommerce. Pricing API
  version: v1
  description: Robust pricing management functionality based on price list and dynamic evaluation
tags:
- name: Pricing
  description: Robust pricing management functionality based on price list and dynamic evaluation
paths:
  /api/pricing/evaluate:
    post:
      tags:
      - Pricing
      summary: Evaluate prices by given context
      operationId: PricingModule_EvaluatePrices
      requestBody:
        description: Pricing evaluation context
        content:
          application/json-patch+json:
            schema:
              allOf:
              - $ref: '#/components/schemas/PriceEvaluationContext'
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/PriceEvaluationContext'
          text/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/PriceEvaluationContext'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Price'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Price'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Price'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - pricing:read
      - api_key:
        - pricing:read
      - api_key_header:
        - pricing:read
      - http-signature:
        - pricing:read
      - basic:
        - pricing:read
      x-virtocommerce-module-id: VirtoCommerce.Pricing
  /api/pricing/pricelists/evaluate:
    post:
      tags:
      - Pricing
      summary: Evaluate pricelists by given context
      operationId: PricingModule_EvaluatePriceLists
      requestBody:
        description: Pricing evaluation context
        content:
          application/json-patch+json:
            schema:
              allOf:
              - $ref: '#/components/schemas/PriceEvaluationContext'
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/PriceEvaluationContext'
          text/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/PriceEvaluationContext'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pricelist'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pricelist'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pricelist'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - pricing:read
      - api_key:
        - pricing:read
      - api_key_header:
        - pricing:read
      - http-signature:
        - pricing:read
      - basic:
        - pricing:read
      x-virtocommerce-module-id: VirtoCommerce.Pricing
  /api/pricing/assignments/{id}:
    get:
      tags:
      - Pricing
      summary: Get pricelist assignment
      operationId: PricingModule_GetPricelistAssignmentById
      parameters:
      - name: id
        in: path
        description: Pricelist assignment id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PricelistAssignment'
            application/json:
              schema:
                $ref: '#/components/schemas/PricelistAssignment'
            text/json:
              schema:
                $ref: '#/components/schemas/PricelistAssignment'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - pricing:read
      - api_key:
        - pricing:read
      - api_key_header:
        - pricing:read
      - http-signature:
        - pricing:read
      - basic:
        - pricing:read
      x-virtocommerce-module-id: VirtoCommerce.Pricing
    patch:
      tags:
      - Pricing
      summary: Partial update for the specified pricelist assignment by id
      operationId: PricingModule_PatchPriceListAssignment
      parameters:
      - name: id
        in: path
        description: PricelistAssignment id
        required: true
        schema:
          type: string
      requestBody:
        description: JsonPatchDocument object with fields to update
        content:
          application/json-patch+json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Operation'
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Operation'
          text/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Operation'
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - pricing:read
        - pricing:update
      - api_key:
        - pricing:read
        - pricing:update
      - api_key_header:
        - pricing:read
        - pricing:update
      - http-signature:
        - pricing:read
        - pricing:update
      - basic:
        - pricing:read
        - pricing:update
      x-virtocommerce-module-id: VirtoCommerce.Pricing
  /api/pricing/assignments/outer/{outerId}:
