        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - pricing:read
        - pricing:update
      - api_key:
        - pricing:read
        - pricing:update
      - api_key_header:
        - pricing:read
        - pricing:update
      - http-signature:
        - pricing:read
        - pricing:update
      - basic:
        - pricing:read
        - pricing:update
      x-virtocommerce-module-id: VirtoCommerce.Pricing
    delete:
      tags:
      - Pricing
      summary: Delete pricelists
      description: Delete pricelists by given array of pricelist ids.
      operationId: PricingModule_DeletePricelists
      parameters:
      - name: ids
        in: query
        description: An array of pricelist ids
        schema:
          type: array
          items:
            type: string
