openapi: 3.2.0
info:
  title: VirtoCommerce. Webhooks API
  version: v1
  description: Manage user defined webhooks
tags:
- name: Webhooks
  description: Manage user defined webhooks
paths:
  /api/webhooks/{id}:
    get:
      tags:
      - Webhooks
      summary: Gets VirtoCommerce.WebhooksModule.Core.Models.Webhook by id
      operationId: WebHooks_GetWebhookById
      parameters:
      - name: id
        in: path
        description: ''
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Webhook'
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
            text/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - webhooks:read
      - api_key:
        - webhooks:read
      - api_key_header:
        - webhooks:read
      - http-signature:
        - webhooks:read
      - basic:
        - webhooks:read
      x-virtocommerce-module-id: VirtoCommerce.WebHooks
  /api/webhooks/search:
    post:
      tags:
      - Webhooks
      summary: Searches webhooks by certain criteria
      operationId: WebHooks_Search
      requestBody:
        description: ''
        content:
          application/json-patch+json:
            schema:
              allOf:
              - $ref: '#/components/schemas/WebhookSearchCriteria'
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/WebhookSearchCriteria'
          text/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/WebhookSearchCriteria'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/WebhookSearchResult'
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSearchResult'
            text/json:
              schema:
                $ref: '#/components/schemas/WebhookSearchResult'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - webhooks:read
      - api_key:
        - webhooks:read
      - api_key_header:
        - webhooks:read
      - http-signature:
        - webhooks:read
      - basic:
        - webhooks:read
      x-virtocommerce-module-id: VirtoCommerce.WebHooks
  /api/webhooks/feed/search:
    post:
      tags:
      - Webhooks
      summary: Searches webhook logs by certain criteria
      operationId: WebHooks_SearchWebhookFeed
      requestBody:
        description: ''
        content:
          application/json-patch+json:
            schema:
              allOf:
              - $ref: '#/components/schemas/WebhookFeedSearchCriteria'
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/WebhookFeedSearchCriteria'
          text/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/WebhookFeedSearchCriteria'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/WebHookFeedSearchResult'
            application/json:
              schema:
                $ref: '#/components/schemas/WebHookFeedSearchResult'
            text/json:
              schema:
                $ref: '#/components/schemas/WebHookFeedSearchResult'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - webhooks:feed:read
      - api_key:
        - webhooks:feed:read
      - api_key_header:
        - webhooks:feed:read
      - http-signature:
        - webhooks:feed:read
      - basic:
        - webhooks:feed:read
      x-virtocommerce-module-id: VirtoCommerce.WebHooks
  /api/webhooks/feed:
    delete:
      tags:
      - Webhooks
      summary: Delete webHookFeeds by ids
      operationId: WebHooks_DeleteWebHookFeeds
      parameters:
      - name: ids
        in: query
        description: WebHook Feeds ids to delete.
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - webhooks:delete
      - api_key:
        - webhooks:delete
      - api_key_header:
        - webhooks:delete
      - http-signature:
        - webhooks:delete
      - basic:
        - webhooks:delete
      x-virtocommerce-module-id: VirtoCommerce.WebHooks
  /api/webhooks:
    post:
      tags:
      - Webhooks
      summary: Creates or updates the webhooks
      operationId: WebHooks_SaveWebhooks
      requestBody:
        description: Webhooks to save.
        content:
          application/json-patch+json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Webhook'
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Webhook'
          text/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Webhook'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Webhook'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Webhook'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Webhook'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - webhooks:update
      - api_key:
        - webhooks:update
      - api_key_header:
        - webhooks:update
      - http-signature:
        - webhooks:update
      - basic:
        - webhooks:update
      x-virtocommerce-module-id: VirtoCommerce.WebHooks
    delete:
      tags:
      - Webhooks
      summary: Deletes webhooks by ids
      operationId: WebHooks_DeleteWebHooks
      parameters:
      - name: ids
        in: query
        description: Webhook ids to delete.
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - webhooks:delete
      - api_key:
        - webhooks:delete
      - api_key_header:
        - webhooks:delete
      - http-signature:
        - webhooks:delete
      - basic:
        - webhooks:delete
      x-virtocommerce-module-id: VirtoCommerce.WebHooks
  /api/webhooks/send:
    post:
      tags:
      - Webhooks
      summary: Sends request with given params to webhook and returns result
      operationId: WebHooks_Run
      requestBody:
        description: Request params.
        content:
          application/json-patch+json:
            schema:
              allOf:
              - $ref: '#/components/schemas/Webhook'
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/Webhook'
          text/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/Webhook'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/WebhookSendResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSendResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/WebhookSendResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2: []
      - api_key: []
      - api_key_header: []
      - http-signature: []
      - basic: []
      x-virtocommerce-module-id: VirtoCommerce.WebHooks
  /api/webhooks/events:
    get:
      tags:
      - Webhooks
      summary: Gets all registered events that could trigger webhook notification
      operationId: WebHooks_GetAllRegisteredEvents
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RegisteredEvent'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RegisteredEvent'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RegisteredEvent'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - webhooks:read
      - api_key:
        - webhooks:read
      - api_key_header:
        - webhooks:read
      - http-signature:
        - webhooks:read
      - basic:
        - webhooks:read
      x-virtocommerce-module-id: VirtoCommerce.WebHooks
  /api/webhooks/properties:
    get:
      tags:
      - Webhooks
      operationId: WebHooks_GetEventObjectProperties
      parameters:
      - name: objectType
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/EventObjectProperties'
            application/json:
              schema:
                $ref: '#/components/schemas/EventObjectProperties'
            text/json:
              schema:
                $ref: '#/components/schemas/EventObjectProperties'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - webhooks:read
      - api_key:
        - webhooks:read
      - api_key_header:
        - webhooks:read
      - http-signature:
        - webhooks:read
      - basic:
        - webhooks:read
      x-virtocommerce-module-id: VirtoCommerce.WebHooks
      summary: Web hooks get event object properties
      x-summary-source: derived
components:
  schemas:
    WebhookSearchResult:
      type: object
      properties:
        totalCount:
          type: integer
          format: int32
        results:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Webhook'
      additionalProperties: false
    WebHookPayload:
      type: object
      properties:
        eventPropertyName:
          type:
          - string
          - 'null'
        webHookId:
          type:
          - string
          - 'null'
        createdDate:
          type: string
          format: date-time
        modifiedDate:
          type:
          - string
          - 'null'
          format: date-time
        createdBy:
          maxLength: 64
          minLength: 0
          type:
          - string
          - 'null'
        modifiedBy:
          maxLength: 64
          minLength: 0
          type:
          - string
          - 'null'
        id:
          type:
          - string
          - 'null'
      additionalProperties: false
    SortDirection:
      enum:
      - Ascending
      - Descending
      type: string
    WebhookFeedEntry:
      type: object
      properties:
        webHookId:
          type:
          - string
          - 'null'
        eventId:
          type:
          - string
          - 'null'
        attemptCount:
          type: integer
          format: int32
        status:
          type: integer
          format: int32
        recordType:
          type: integer
          format: int32
        error:
          type:
          - string
          - 'null'
        requestHeaders:
          type:
          - string
          - 'null'
        requestBody:
          type:
          - string
          - 'null'
        responseHeaders:
          type:
          - string
          - 'null'
        responseBody:
          type:
          - string
          - 'null'
        createdDate:
          type: string
          format: date-time
        modifiedDate:
          type:
          - string
          - 'null'
          format: date-time
        createdBy:
          maxLength: 64
          minLength: 0
          type:
          - string
          - 'null'
        modifiedBy:
          maxLength: 64
          minLength: 0
          type:
          - string
          - 'null'
        id:
          type:
          - string
          - 'null'
      additionalProperties: false
    RegisteredEvent:
      type: object
      properties:
        eventType:
          type:
          - string
          - 'null'
        displayName:
          type:
          - string
          - 'null'
        id:
          type:
          - string
          - 'null'
      additionalProperties: false
    EventObjectProperties:
      type: object
      properties:
        discovered:
          type: boolean
        properties:
          type:
          - array
          - 'null'
          items:
            type: string
      additionalProperties: false
    AuthenticationType:
      enum:
      - None
      - Basic
      - BearerToken
      - CustomHeader
      type: string
    WebhookFeedSearchCriteria:
      type: object
      properties:
        webHookIds:
          type:
          - array
          - 'null'
          items:
            type: string
        eventIds:
          type:
          - array
          - 'null'
          items:
            type: string
        statuses:
          type:
          - array
          - 'null'
          items:
            type: integer
            format: int32
        recordTypes:
          type:
          - array
          - 'null'
          items:
            type: integer
            format: int32
        responseGroup:
          type:
          - string
          - 'null'
        objectType:
          type:
          - string
          - 'null'
        objectTypes:
          type:
          - array
          - 'null'
          items:
            type: string
        objectIds:
          type:
          - array
          - 'null'
          items:
            type: string
        keyword:
          type:
          - string
          - 'null'
        searchPhrase:
          type:
          - string
          - 'null'
        languageCode:
          type:
          - string
          - 'null'
        sort:
          type:
          - string
          - 'null'
        sortInfos:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SortInfo'
          readOnly: true
        skip:
          type: integer
          format: int32
        take:
          type: integer
          format: int32
      additionalProperties: false
    WebHookFeedSearchResult:
      type: object
      properties:
        totalCount:
          type: integer
          format: int32
        results:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/WebhookFeedEntry'
      additionalProperties: false
    Webhook:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
        url:
          type:
          - string
          - 'null'
        contentType:
          type:
          - string
          - 'null'
        authType:
          allOf:
          - $ref: '#/components/schemas/AuthenticationType'
        basicUsername:
          type:
          - string
          - 'null'
        basicPassword:
          type:
          - string
          - 'null'
        bearerToken:
          type:
          - string
          - 'null'
        customHttpHeaderName:
          type:
          - string
          - 'null'
        customHttpHeaderValue:
          type:
          - string
          - 'null'
        isActive:
          type: boolean
        successCount:
          type: integer
          format: int64
        errorCount:
          type: integer
          format: int64
        events:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/WebhookEvent'
        requestParams:
          allOf:
          - $ref: '#/components/schemas/WebhookHttpParams'
        payloads:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/WebHookPayload'
        createdDate:
          type: string
          format: date-time
        modifiedDate:
          type:
          - string
          - 'null'
          format: date-time
        createdBy:
          maxLength: 64
          minLength: 0
          type:
          - string
          - 'null'
        modifiedBy:
          maxLength: 64
          minLength: 0
          type:
          - string
          - 'null'
        id:
          type:
          - string
          - 'null'
      additionalProperties: false
    WebhookEvent:
      type: object
      properties:
        webHookId:
          type:
          - string
          - 'null'
        eventId:
          type:
          - string
          - 'null'
        displayName:
          type:
          - string
          - 'null'
        createdDate:
          type: string
          format: date-time
        modifiedDate:
          type:
          - string
          - 'null'
          format: date-time
        createdBy:
          maxLength: 64
          minLength: 0
          type:
          - string
          - 'null'
        modifiedBy:
          maxLength: 64
          minLength: 0
          type:
          - string
          - 'null'
        id:
          type:
          - string
          - 'null'
      additionalProperties: false
    WebhookHttpParams:
      type: object
      properties:
        headers:
          type:
          - object
          - 'null'
          additionalProperties:
            type:
            - string
            - 'null'
        body:
          type:
          - string
          - 'null'
      additionalProperties: false
    SortInfo:
      type: object
      properties:
        sortColumn:
          type:
          - string
          - 'null'
        sortDirection:
          allOf:
          - $ref: '#/components/schemas/SortDirection'
      additionalProperties: false
    WebhookSendResponse:
      type: object
      properties:
        statusCode:
          type: integer
          format: int32
        error:
          type:
          - string
          - 'null'
        responseParams:
          allOf:
          - $ref: '#/components/schemas/WebhookHttpParams'
        isSuccessfull:
          type: boolean
      additionalProperties: false
    WebhookSearchCriteria:
      type: object
      properties:
        isActive:
          type:
          - boolean
          - 'null'
        eventIds:
          type:
          - array
          - 'null'
          items:
            type: string
        responseGroup:
          type:
          - string
          - 'null'
        objectType:
          type:
          - string
          - 'null'
        objectTypes:
          type:
          - array
          - 'null'
          items:
            type: string
        objectIds:
          type:
          - array
          - 'null'
          items:
            type: string
        keyword:
          type:
          - string
          - 'null'
        searchPhrase:
          type:
          - string
          - 'null'
        languageCode:
          type:
          - string
          - 'null'
        sort:
          type:
          - string
          - 'null'
        sortInfos:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SortInfo'
          readOnly: true
        skip:
          type: integer
          format: int32
        take:
          type: integer
          format: int32
      additionalProperties: false
  securitySchemes:
    oauth2:
      type: oauth2
      description: OAuth2 Resource Owner Password Grant flow
      flows:
        password:
          tokenUrl: /connect/token
          scopes: {}
        clientCredentials:
          tokenUrl: /connect/token
          scopes: {}
    api_key:
      type: apiKey
      description: API Key authentication
      name: api_key
      in: query
    api_key_header:
      type: apiKey
      description: API Key authentication (alternative via header)
      name: api_key
      in: header
    http-signature:
      type: http
      description: HTTP Signature authentication using Authorization header
      scheme: signature
    basic:
      type: http
      description: Basic authentication using username and password
      scheme: basic
