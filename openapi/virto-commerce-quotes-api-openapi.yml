        name:
          type:
          - string
          - 'null'
        languageCode:
          type:
          - string
          - 'null'
      additionalProperties: false
    PropertyValueType:
      enum:
      - ShortText
      - LongText
      - Number
      - DateTime
      - Boolean
      - Integer
      - GeoPoint
      - Html
      - Measure
      - Color
      type: string
    Variation:
      type: object
      properties:
        productType:
          type:
          - string
          - 'null'
          description: The type of product. Can be "Physical", "Digital", etc.
        code:
          type:
          - string
          - 'null'
          description: The Stock Keeping Unit (SKU) code for the product.
        manufacturerPartNumber:
          type:
          - string
          - 'null'
          description: A manufacturer part number (MPN) is a unique alphanumeric code assigned by a manufacturer to identify a specific product or component. It is used primarily for part tracking in inventory management, supply chain operations, and ordering purposes.
        gtin:
          type:
          - string
          - 'null'
          description: The Global Trade Item Number (GTIN) for the product. This can include UPC (in North America), EAN (in Europe), JAN (in Japan), and ISBN (for books).
        name:
          type:
          - string
          - 'null'
          description: The name of the product.
        localizedName:
          allOf:
          - $ref: '#/components/schemas/LocalizedString'
        catalogId:
          type:
          - string
          - 'null'
          description: The ID of the catalog to which this product belongs.
        categoryId:
          type:
          - string
          - 'null'
          description: The ID of the category to which this product belongs.
        outline:
          type:
          - string
          - 'null'
          description: Product outline in physical catalog (all parent categories ids concatenated. E.g. (1/21/344))
          readOnly: true
        path:
          type:
          - string
          - 'null'
          description: Product path in physical catalog (all parent categories names concatenated. E.g. (parent1/parent2))
          readOnly: true
        titularItemId:
          type:
          - string
          - 'null'
          readOnly: true
        mainProductId:
          type:
          - string
          - 'null'
          description: The ID of the main product associated with this product variation.
        isActive:
          type:
          - boolean
          - 'null'
          description: 'Specifies whether the product is currently visible on the store for customers to view and purchase.

            If set to false, the product is currently sold out.'
        isBuyable:
          type:
          - boolean
          - 'null'
          description: 'Specifies whether the product is currently visible on the store for customers to view and purchase.

            If set to false, the product is currently ouf of stock.'
        trackInventory:
          type:
          - boolean
          - 'null'
          description: 'Indicates whether the inventory service is tracking the availability of this product.

            If set to false, the product is considered in stock without any inventory limitations.'
        indexingDate:
          type:
          - string
          - 'null'
          description: The date and time when the product was last indexed for search.
          format: date-time
        maxQuantity:
          type:
          - integer
          - 'null'
          description: The maximum quantity of the product that can be purchased in a single order. A value of 0 indicates that there are no limitations on the maximum quantity.
          format: int32
        minQuantity:
          type:
          - integer
          - 'null'
          description: The minimum quantity of the product that must be purchased in a single order. A value of 0 indicates that there are no limitations on the minimum quantity.
          format: int32
        packSize:
          type: integer
          description: Defines the number of items in a package. Quantity step for your product's. Default value is 1.
          format: int32
        startDate:
          type: string
          description: First listed date and time. If you do not specify an end date, the product will be active until you deactivate it.If you do not specify an end date, the product will be active until you deactivate it.If you do not specify a start date, the product will become active immediately once you save it.
          format: date-time
        endDate:
          type:
          - string
          - 'null'
          description: Listing expires on the specific date and time. If you do not specify an end date, the product will be active until you deactivate it.
          format: date-time
        packageType:
          type:
          - string
          - 'null'
          description: The type of package for this product, which determines the product's specific dimensions.
        weightUnit:
          type:
          - string
          - 'null'
          description: The unit of measurement for the product's weight.
        weight:
          type:
          - number
          - 'null'
          description: The weight of the product, in the unit specified by the WeightUnit property.
          format: double
        measureUnit:
          type:
          - string
          - 'null'
          description: The unit of measurement for the product's height, length, and width.
        height:
          type:
          - number
          - 'null'
          description: The height of the product, in the unit specified by the MeasureUnit property.
          format: double
        length:
          type:
          - number
          - 'null'
          description: The length of the product, in the unit specified by the MeasureUnit property.
          format: double
        width:
          type:
          - number
          - 'null'
          description: The width of the product, in the unit specified by the MeasureUnit property.
          format: double
        enableReview:
          type:
          - boolean
          - 'null'
        maxNumberOfDownload:
          type:
          - integer
          - 'null'
          description: The maximum number of times the product can be downloaded. A value of 0 indicates no limit.
          format: int32
        downloadExpiration:
          type:
          - string
          - 'null'
          description: The date and time when the download link or access to the product will expire.
          format: date-time
        downloadType:
          type:
          - string
          - 'null'
          description: 'The type of product download. Valid values include: "Standard Product", "Software", and "Music".'
        hasUserAgreement:
          type:
          - boolean
          - 'null'
          description: Indicates whether the product requires the user to agree to any terms or conditions before downloading.
        shippingType:
          type:
          - string
          - 'null'
          description: Specifies the type of shipping option available for the product.
        taxType:
          type:
          - string
          - 'null'
          description: Specifies the type of tax applied to the product.
        vendor:
          type:
          - string
          - 'null'
          description: ID of the vendor associated with the product.
        priority:
          type: integer
          description: Indicates the position of the product in the catalog for ordering purposes.
          format: int32
        outerId:
          type:
          - string
          - 'null'
          description: An external identifier for the product that can be used for integration with external systems.
        properties:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Property'
        excludedProperties:
          type:
          - array
          - 'null'
          items:
