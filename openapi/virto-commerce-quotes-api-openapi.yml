      tags:
      - Quotes
      operationId: QuoteModule_GetById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '404':
          description: Not Found
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/QuoteRequest'
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteRequest'
            text/json:
              schema:
                $ref: '#/components/schemas/QuoteRequest'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - quote:read
      - api_key:
        - quote:read
      - api_key_header:
        - quote:read
      - http-signature:
        - quote:read
      - basic:
        - quote:read
      x-virtocommerce-module-id: VirtoCommerce.Quote
