          text/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/QuoteRequest'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/QuoteRequest'
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteRequest'
            text/json:
              schema:
                $ref: '#/components/schemas/QuoteRequest'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - quote:read
        - quote:create
      - api_key:
        - quote:read
        - quote:create
      - api_key_header:
        - quote:read
        - quote:create
      - http-signature:
        - quote:read
        - quote:create
      - basic:
        - quote:read
        - quote:create
      x-virtocommerce-module-id: VirtoCommerce.Quote
      summary: Quote module create
      x-summary-source: derived
    put:
