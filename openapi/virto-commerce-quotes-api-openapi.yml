        in: query
        schema:
          type: array
          items:
            type: string
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - quote:read
        - quote:delete
      - api_key:
        - quote:read
        - quote:delete
      - api_key_header:
        - quote:read
        - quote:delete
      - http-signature:
        - quote:read
