      - api_key_header:
        - quote:read
      - http-signature:
        - quote:read
      - basic:
        - quote:read
      x-virtocommerce-module-id: VirtoCommerce.Quote
      summary: Quote module calculate totals
      x-summary-source: derived
  /api/quote/requests/{id}/shipmentmethods:
