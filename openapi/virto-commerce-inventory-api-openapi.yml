components:
  schemas:
    InventoryInfo:
      type: object
      properties:
        fulfillmentCenterId:
          type:
          - string
          - 'null'
        fulfillmentCenterName:
          type:
          - string
          - 'null'
        fulfillmentCenter:
          allOf:
          - $ref: '#/components/schemas/FulfillmentCenter'
        productId:
          type:
          - string
          - 'null'
        inStockQuantity:
          type: integer
          format: int64
        reservedQuantity:
          type: integer
          format: int64
        reorderMinQuantity:
          type: integer
          format: int64
        preorderQuantity:
          type: integer
          format: int64
        backorderQuantity:
          type: integer
          format: int64
        allowBackorder:
          type: boolean
        allowPreorder:
          type: boolean
        inTransit:
          type: integer
          format: int64
        preorderAvailabilityDate:
          type:
          - string
          - 'null'
          format: date-time
        backorderAvailabilityDate:
          type:
          - string
          - 'null'
          format: date-time
        status:
          allOf:
          - $ref: '#/components/schemas/InventoryStatus'
        outerId:
          type:
          - string
          - 'null'
        createdDate:
          type: string
          format: date-time
        modifiedDate:
          type:
          - string
          - 'null'
          format: date-time
        createdBy:
          maxLength: 64
          minLength: 0
          type:
          - string
          - 'null'
        modifiedBy:
          maxLength: 64
          minLength: 0
          type:
          - string
          - 'null'
        id:
          type:
          - string
          - 'null'
      additionalProperties: false
    AddressType:
      enum:
      - Undefined
      - Billing
      - Shipping
      - BillingAndShipping
      - Pickup
      type: string
    SortDirection:
      enum:
      - Ascending
      - Descending
      type: string
    InventoryStatus:
      enum:
      - Disabled
      - Enabled
      - Ignored
      type: string
    InventorySearchCriteria:
      type: object
      properties:
        fulfillmentCenterIds:
          type:
          - array
          - 'null'
          items:
            type: string
        productIds:
          type:
          - array
          - 'null'
          items:
            type: string
        responseGroup:
          type:
          - string
          - 'null'
        objectType:
          type:
          - string
          - 'null'
        objectTypes:
          type:
          - array
          - 'null'
          items:
            type: string
        objectIds:
          type:
          - array
          - 'null'
          items:
            type: string
        keyword:
          type:
          - string
          - 'null'
        searchPhrase:
          type:
          - string
          - 'null'
        languageCode:
          type:
          - string
          - 'null'
        sort:
          type:
          - string
          - 'null'
        sortInfos:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SortInfo'
          readOnly: true
        skip:
          type: integer
          format: int32
        take:
          type: integer
          format: int32
      additionalProperties: false
    DynamicPropertyValueType:
      enum:
      - Undefined
      - ShortText
      - LongText
      - Integer
      - Decimal
      - DateTime
      - Boolean
      - Html
      - Image
      type: string
    FulfillmentCenter:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        shortDescription:
          type:
          - string
          - 'null'
        geoLocation:
          type:
          - string
          - 'null'
        address:
          allOf:
          - $ref: '#/components/schemas/InventoryAddress'
        outerId:
          type:
          - string
          - 'null'
        organizationId:
          type:
          - string
          - 'null'
        objectType:
          type:
          - string
          - 'null'
          readOnly: true
        dynamicProperties:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/DynamicObjectProperty'
        createdDate:
          type: string
          format: date-time
        modifiedDate:
          type:
          - string
          - 'null'
          format: date-time
        createdBy:
          maxLength: 64
          minLength: 0
          type:
          - string
          - 'null'
        modifiedBy:
          maxLength: 64
          minLength: 0
          type:
          - string
          - 'null'
        id:
          type:
          - string
          - 'null'
      additionalProperties: false
