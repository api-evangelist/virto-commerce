openapi: 3.2.0
info:
  title: VirtoCommerce. Inventory API
  version: v1
  description: Simplify inventory management functionality
tags:
- name: Inventory
  description: Simplify inventory management functionality
paths:
  /api/inventory/search:
    post:
      tags:
      - Inventory
      summary: Search inventories by given criteria
      operationId: InventoryModule_SearchInventories
      requestBody:
        content:
          application/json-patch+json:
            schema:
              allOf:
              - $ref: '#/components/schemas/InventorySearchCriteria'
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/InventorySearchCriteria'
          text/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/InventorySearchCriteria'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/InventoryInfoSearchResult'
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryInfoSearchResult'
            text/json:
              schema:
                $ref: '#/components/schemas/InventoryInfoSearchResult'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - inventory:read
      - api_key:
        - inventory:read
      - api_key_header:
        - inventory:read
      - http-signature:
        - inventory:read
      - basic:
        - inventory:read
      x-virtocommerce-module-id: VirtoCommerce.Inventory
  /api/inventory/product/search:
    post:
      tags:
      - Inventory
      summary: Search inventories by given criteria
      operationId: InventoryModule_SearchProductInventories
      requestBody:
        content:
          application/json-patch+json:
            schema:
              allOf:
              - $ref: '#/components/schemas/ProductInventorySearchCriteria'
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/ProductInventorySearchCriteria'
          text/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/ProductInventorySearchCriteria'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/InventoryInfoSearchResult'
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryInfoSearchResult'
            text/json:
              schema:
                $ref: '#/components/schemas/InventoryInfoSearchResult'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - inventory:read
      - api_key:
        - inventory:read
      - api_key_header:
        - inventory:read
      - http-signature:
        - inventory:read
      - basic:
        - inventory:read
      x-virtocommerce-module-id: VirtoCommerce.Inventory
  /api/inventory/fulfillmentcenters/search:
    post:
      tags:
      - Inventory
      summary: Search fulfillment centers registered in the system
      operationId: InventoryModule_SearchFulfillmentCenters
      requestBody:
        content:
          application/json-patch+json:
            schema:
              allOf:
              - $ref: '#/components/schemas/FulfillmentCenterSearchCriteria'
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/FulfillmentCenterSearchCriteria'
          text/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/FulfillmentCenterSearchCriteria'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/FulfillmentCenterSearchResult'
            application/json:
              schema:
                $ref: '#/components/schemas/FulfillmentCenterSearchResult'
            text/json:
              schema:
                $ref: '#/components/schemas/FulfillmentCenterSearchResult'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - inventory:fulfillment:read
      - api_key:
        - inventory:fulfillment:read
      - api_key_header:
        - inventory:fulfillment:read
      - http-signature:
        - inventory:fulfillment:read
      - basic:
        - inventory:fulfillment:read
      x-virtocommerce-module-id: VirtoCommerce.Inventory
  /api/inventory/fulfillmentcenters/{id}:
    get:
      tags:
      - Inventory
      summary: Get fulfillment center by id
      operationId: InventoryModule_GetFulfillmentCenter
      parameters:
      - name: id
        in: path
        description: fulfillment center id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/FulfillmentCenter'
            application/json:
              schema:
                $ref: '#/components/schemas/FulfillmentCenter'
            text/json:
              schema:
                $ref: '#/components/schemas/FulfillmentCenter'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - inventory:fulfillment:read
      - api_key:
        - inventory:fulfillment:read
      - api_key_header:
        - inventory:fulfillment:read
      - http-signature:
        - inventory:fulfillment:read
      - basic:
        - inventory:fulfillment:read
      x-virtocommerce-module-id: VirtoCommerce.Inventory
    patch:
      tags:
      - Inventory
      summary: Partial update for the specified FulfillmentCenter by id
      operationId: InventoryModule_PatchFulfillmentCenter
      parameters:
      - name: id
        in: path
        description: FulfillmentCenter id
        required: true
        schema:
          type: string
      requestBody:
        description: JsonPatchDocument object with fields to update
        content:
          application/json-patch+json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Operation'
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Operation'
          text/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Operation'
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - inventory:fulfillment:edit
      - api_key:
        - inventory:fulfillment:edit
      - api_key_header:
        - inventory:fulfillment:edit
      - http-signature:
        - inventory:fulfillment:edit
      - basic:
        - inventory:fulfillment:edit
      x-virtocommerce-module-id: VirtoCommerce.Inventory
  /api/inventory/fulfillmentcenters/outer/{outerId}:
    get:
      tags:
      - Inventory
      summary: Get fulfillment center by outer id
      operationId: InventoryModule_GetFulfillmentCenterByOuterId
      parameters:
      - name: outerId
        in: path
        description: fulfillment center outer id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/FulfillmentCenter'
            application/json:
              schema:
