            text/json:
              schema:
                $ref: '#/components/schemas/FulfillmentCenter'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - inventory:fulfillment:read
      - api_key:
        - inventory:fulfillment:read
      - api_key_header:
        - inventory:fulfillment:read
      - http-signature:
        - inventory:fulfillment:read
      - basic:
        - inventory:fulfillment:read
      x-virtocommerce-module-id: VirtoCommerce.Inventory
  /api/inventory/fulfillmentcenters/plenty:
    post:
      tags:
      - Inventory
      summary: Get fulfillment centers by ids
      operationId: InventoryModule_GetFulfillmentCenters
      requestBody:
        description: fulfillment center ids
        content:
          application/json-patch+json:
            schema:
              type: array
              items:
                type: string
          application/json:
            schema:
              type: array
              items:
                type: string
          text/json:
            schema:
              type: array
              items:
                type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FulfillmentCenter'
            application/json:
              schema:
                type: array
                items:
