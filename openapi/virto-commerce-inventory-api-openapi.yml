            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FulfillmentCenter'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - inventory:fulfillment:read
      - api_key:
        - inventory:fulfillment:read
      - api_key_header:
        - inventory:fulfillment:read
      - http-signature:
        - inventory:fulfillment:read
      - basic:
        - inventory:fulfillment:read
      x-virtocommerce-module-id: VirtoCommerce.Inventory
  /api/inventory/fulfillmentcenters:
    put:
      tags:
      - Inventory
      summary: Save fulfillment center
      operationId: InventoryModule_SaveFulfillmentCenter
      requestBody:
        description: fulfillment center
        content:
          application/json-patch+json:
            schema:
              allOf:
              - $ref: '#/components/schemas/FulfillmentCenter'
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/FulfillmentCenter'
          text/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/FulfillmentCenter'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/FulfillmentCenter'
            application/json:
              schema:
                $ref: '#/components/schemas/FulfillmentCenter'
            text/json:
              schema:
                $ref: '#/components/schemas/FulfillmentCenter'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - inventory:fulfillment:edit
      - api_key:
        - inventory:fulfillment:edit
      - api_key_header:
        - inventory:fulfillment:edit
      - http-signature:
        - inventory:fulfillment:edit
      - basic:
        - inventory:fulfillment:edit
      x-virtocommerce-module-id: VirtoCommerce.Inventory
    delete:
      tags:
      - Inventory
      summary: Delete fulfillment centers registered in the system
      operationId: InventoryModule_DeleteFulfillmentCenters
      parameters:
      - name: ids
        in: query
        schema:
          type: array
          items:
            type: string
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - inventory:fulfillment:delete
      - api_key:
        - inventory:fulfillment:delete
      - api_key_header:
        - inventory:fulfillment:delete
      - http-signature:
        - inventory:fulfillment:delete
      - basic:
        - inventory:fulfillment:delete
      x-virtocommerce-module-id: VirtoCommerce.Inventory
  /api/inventory/fulfillmentcenters/batch:
    post:
      tags:
      - Inventory
      summary: Save fulfillment centers
      operationId: InventoryModule_SaveFulfillmentCenters
      requestBody:
        description: fulfillment centers
        content:
          application/json-patch+json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/FulfillmentCenter'
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/FulfillmentCenter'
          text/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/FulfillmentCenter'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FulfillmentCenter'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FulfillmentCenter'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FulfillmentCenter'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - inventory:fulfillment:edit
      - api_key:
        - inventory:fulfillment:edit
      - api_key_header:
        - inventory:fulfillment:edit
      - http-signature:
        - inventory:fulfillment:edit
      - basic:
        - inventory:fulfillment:edit
      x-virtocommerce-module-id: VirtoCommerce.Inventory
  /api/inventory/products/{productId}:
    get:
      tags:
      - Inventory
      summary: Get inventories of product
      description: Get inventories of product for each fulfillment center.
      operationId: InventoryModule_GetProductInventories
      parameters:
      - name: productId
        in: path
        description: Product id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InventoryInfo'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InventoryInfo'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InventoryInfo'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - inventory:read
      - api_key:
        - inventory:read
      - api_key_header:
        - inventory:read
      - http-signature:
        - inventory:read
      - basic:
        - inventory:read
      x-virtocommerce-module-id: VirtoCommerce.Inventory
    put:
      tags:
      - Inventory
      summary: Update inventory
      description: Update given inventory of product.
      operationId: InventoryModule_UpdateProductInventory
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        description: Inventory to update
        content:
          application/json-patch+json:
            schema:
              allOf:
              - $ref: '#/components/schemas/InventoryInfo'
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/InventoryInfo'
          text/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/InventoryInfo'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/InventoryInfo'
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryInfo'
            text/json:
              schema:
                $ref: '#/components/schemas/InventoryInfo'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - inventory:update
      - api_key:
        - inventory:update
      - api_key_header:
        - inventory:update
      - http-signature:
        - inventory:update
      - basic:
        - inventory:update
      x-virtocommerce-module-id: VirtoCommerce.Inventory
  /api/inventory/products:
    get:
      tags:
      - Inventory
      summary: Get inventories of products
      description: Get inventory of products for each fulfillment center.
      operationId: InventoryModule_GetProductInventories
      parameters:
      - name: ids
        in: query
        description: Products ids
        schema:
          type: array
          items:
            type: string
      - name: fulfillmentCenterIds
        in: query
        description: The fulfillment centers that will be used to filter product inventories
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InventoryInfo'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InventoryInfo'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InventoryInfo'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - oauth2:
        - inventory:read
      - api_key:
        - inventory:read
      - api_key_header:
        - inventory:read
      - http-signature:
        - inventory:read
      - basic:
        - inventory:read
      x-virtocommerce-module-id: VirtoCommerce.Inventory
  /api/inventory/products/plenty:
    post:
      tags:
      - Inventory
      summary: Get inventories of products
      description: Get inventory of products for each fulfillment center.
      operationId: InventoryModule_GetProductsInventoriesByPlentyIds
      parameters:
      - name: fulfillmentCenterIds
        in: query
        description: The fulfillment centers that will be used to filter product inventories
        schema:
          type: array
          items:
            type: string
      requestBody:
        description: Products ids
        content:
          application/json-patch+json:
            schema:
              type: array
              items:
                type: string
          application/json:
            schema:
              type: array
              items:
                type: string
          text/json:
            schema:
              type: array
              items:
                type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InventoryInfo'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InventoryInfo'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InventoryInfo'
