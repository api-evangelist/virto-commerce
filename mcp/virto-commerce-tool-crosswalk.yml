    Builds the country lookup map during connect(). Not present in the captured
    VirtoCommerce.Platform document; it belongs to the VirtoCommerce.Core module document,
    which is not part of this repo's OpenAPI set.
mcp_only: []
mcp_only_note: >-
  Every MCP tool resolves to public REST operations; the adapter adds no capability that the
  REST API lacks. Its value is composition (chained read-modify-write flows) and vocabulary
  translation (MCP order statuses on_hold/processing/pending → Virto OnHold/Processing/New).
graphql_only:
- fields_estimate: 233
  note: >-
    The xAPI exposes 89 queries and 144 mutations covering storefront concerns the MCP tools
    do not touch at all — carts and wishlists, quotes, configured line items, loyalty, push
    messages, purchase requests, customer reviews, CMS pages and menus. None of these are
    reachable through the MCP surface.
rest_only:
  note: >-
    The captured OpenAPI set describes 434+ admin operations across catalog, pricing,
    inventory, orders, customers, marketing, quotes, stores, returns, webhooks, event bus and
    the platform itself. The 12 MCP tools bind roughly 10 distinct operations, so the
    overwhelming majority of the REST surface — including all of marketing, quotes, pricing
    administration, webhook management and platform administration — has no MCP tool.
