description: >-
  Virto Commerce's change record is release-driven, not endpoint-driven. Because the platform
  is installable software rather than a hosted API, every change lands as a dated,
  semver-tagged GitHub release on vc-platform (and independently on each of the ~100 module
  repositories), with release notes generated from merged PRs. Three release lines are
  maintained in parallel and receive the same fixes on the same day — 3.10xx (current),
  3.1039.x and 3.1007.x (maintenance) — which is how Virto ships a backport without breaking
  older deployments. A human-readable monthly digest is published separately on the community
  forum, and an interactive release-notes deck lives in the vc-release-notes repository.
scheme: semver
version_scheme_note: >-
  Versions are MAJOR.MINOR.PATCH where MINOR is a monotonically increasing platform build
  number (3.1058.0), not a feature-set version. The API itself is unversioned in the URL —
  paths are /api/<module>/... with no version segment — so platform releases, not API
  versions, are the unit of change. See lifecycle/virto-commerce-lifecycle.yml.
