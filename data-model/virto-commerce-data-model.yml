absent_note: >-
  These names resolve to module-specific schema names in the captured documents
  (InventoryInfo, OrderShipment/CartShipment, OrderLineItem/CartLineItem/QuoteItem) rather than
  to shared types. Line items are NOT a shared type across aggregates: cart, order and quote
  each define their own, which is a real source of mapping work in any integration.
