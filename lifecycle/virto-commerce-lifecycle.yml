    note: >-
      FALSE POSITIVE — the subdomain is unclaimed and 301s to
      atlassian.com/software/statuspage (Atlassian's own marketing page, title "Real-Time
      Incident Communication with Statuspage"). It is not a Virto status page.
  - url: https://status.govirto.com
    status: 404
  checked: '2026-08-13'
  no_pointer_note: >-
    No `StatusPage` pointer is emitted. For a self-hosted platform this is defensible —
    availability belongs to the operator — but Virto Cloud is a managed offering with a
