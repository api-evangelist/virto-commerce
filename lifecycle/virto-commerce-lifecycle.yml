sla:
  published: true
  target: 99.9% uptime
  scope: Virto Commerce Cloud (managed Kubernetes deployment)
  source: plans/virto-commerce-plans-pricing.yml
  note: Self-hosted deployments carry no vendor SLA.
support_lifecycle:
