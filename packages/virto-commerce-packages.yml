description: >-
  Virto Commerce is a self-hosted .NET commerce platform, so its "SDK" surface is not a set of
  thin HTTP client wrappers — it is the platform itself, shipped as first-party NuGet packages
  you compile against, plus first-party npm packages for the Vue 3 admin framework (VC-Shell)
  and tooling. Every package below is published by Virto Commerce under the VirtoCommerce
  NuGet prefix or the @virtocommerce / @vc-shell npm scopes and is verifiably first-party.
  There is no first-party Python, Ruby, Go, PHP or Java client library — those ecosystems are
  not served, which is the honest gap for anyone integrating from outside .NET/JS.
